# Risk assessment for pull requests: the risk tier of each changed path.
# Evaluated by scripts/tier-classify.sh: the classifier rates every PR
# (tier-classifier.yml), and the merge queue leaves high-risk PRs for a
# maintainer to review and merge. What each tier asks of reviewers is in
# docs/risk-tiers.md.
#
# `rules` is an ordered list of `<tier> <glob>` items, where tier is low,
# medium or high. A changed path takes the tier of the FIRST rule whose glob
# matches it, so high-risk rules come before the broad ones (AGENTS.md is high
# even though *.md is low; app/build.gradle.kts is high even though app/* is
# medium). `*` matches across `/`. A path matching no rule is medium.
#
# The classifier reads a strict line subset of YAML: the `rules:` line, one
# `- <tier> <glob>` item per line, blank lines and whole-line `#` comments.
#
# A path has a rule here exactly when .github/labeler.yml gives it a label;
# PolicyLabelParityTest in tests/ fails when the two files drift apart.

rules:
  # CI gates, review rubric, rulesets, and this file itself.
  - high    .github/*

  # Gate tooling: CI scripts and the tests that pin the workflows.
  - high    scripts/*
  - high    tests/*

  # Gate configuration: what detekt and ktlint enforce, so a rule turned off
  # here stops failing `check`. Spotless reads only the root .editorconfig.
  - high    config/*
  - high    .editorconfig

  # Build and dependencies (supply chain): version catalog, wrapper, build scripts.
  # Gradle prefers a Groovy script to the Kotlin one beside it and builds buildSrc
  # with no reference to it, so a new file in either form replaces or joins the
  # build that runs with the release key.
  - high    gradle/*
  - high    *.gradle.kts
  - high    *.gradle
  - high    buildSrc/*
  - high    gradle.properties
  - high    gradlew
  - high    gradlew.bat

  # App permissions and the HOME intent filter. A build type's manifest
  # (app/src/release/) merges over main's into the same APK.
  - high    app/src/*/AndroidManifest.xml

  # Line endings, text/binary handling and diff/merge drivers for every file.
  - high    .gitattributes

  # Agent instructions and governance.
  - high    AGENTS.md
  - high    CLAUDE.md
  - high    .claude/*
  - high    .cursor/*
  - high    .beads/*
  - high    prompts/*

  # Development container and image configuration.
  - high    .devcontainer/*
  - high    Dockerfile*
  - high    */Dockerfile
  - high    .dockerignore

  # Application code and its end-to-end tests.
  - medium  app/*
  - medium  core/*
  - medium  e2e/*

  # Prose that does not execute.
  - low     docs/*
  - low     *.md
