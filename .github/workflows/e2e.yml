name: E2E

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue starts main's run this way: its merges, made with GITHUB_TOKEN, trigger no push run.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One live run per PR: a new push cancels the superseded run. Pushes to main
  # get a per-commit group, so no main run is ever cancelled.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      # The emulator needs hardware acceleration; ubuntu-latest has /dev/kvm but only root may open it.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The runner's SDK has neither the emulator nor the system image the managed device needs. The SDK installer
      # unzips whatever dl.google.com answered without checking its checksum, so a bad download fails with "Archive is
      # not a ZIP archive" (#307). Gradle cannot recover from that in a later attempt: it installs the emulator only
      # alongside a missing system image, and the failed run installed the image. So sdkmanager installs both first, up
      # to three times; a retry finds the kept download's checksum wrong and fetches it again. Only the installs are
      # retried: a failing test must still fail the run. SYSTEM_IMAGE is atdApi35's image (E2eWorkflowTest).
      - name: Install the emulator and its system image
        env:
          SYSTEM_IMAGE: system-images;android-35;aosp_atd;x86_64
        run: |
          for attempt in 1 2 3; do
            if "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install emulator "$SYSTEM_IMAGE"; then
              exit 0
            fi
            echo "::warning::Installing the emulator and its system image failed (attempt $attempt of 3)"
            if [ "$attempt" -lt 3 ]; then
              sleep 30
            fi
          done
          exit 1
      # Gradle Managed Devices boots the emulator headless, installs the debug app and the e2e APK, and runs e2e/'s
      # tests (docs/testing.md#end-to-end-tests).
      - name: End-to-end tests on a managed emulator
        run: ./gradlew :e2e:atdApi35DebugAndroidTest
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-reports
          path: |
            e2e/build/reports/
            e2e/build/outputs/androidTest-results/
          retention-days: 14
