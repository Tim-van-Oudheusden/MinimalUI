name: E2E

# The end-to-end tests (e2e/, #236) on an Android emulator. Booting one costs minutes, so the workflow runs only when
# something that reaches the APK or the tests changes. It is not a required check (.github/rulesets/main.json).
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'core/**'
      - 'e2e/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/e2e.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'core/**'
      - 'e2e/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One live run per PR: a new push cancels the superseded run. Pushes to main
  # get a per-commit group, so no main run is ever cancelled.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E on emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # A phone image of the Android version Robolectric emulates for the unit tests (app/src/test/resources).
      SYSTEM_IMAGE: system-images;android-35;google_apis;x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # The runner has KVM, but only root may open /dev/kvm; the emulator needs it to run an x86_64 image at speed.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The runner image ships the SDK's command-line tools with the licences accepted, but no emulator or system image.
      # The AVD has a hardware keyboard, as the keyboard phones MinimalUI is made for do. ANDROID_AVD_HOME says where
      # avdmanager writes it and the emulator finds it.
      - name: Create emulator
        run: |
          export ANDROID_AVD_HOME="$RUNNER_TEMP/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install emulator "$SYSTEM_IMAGE" > /dev/null
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force -n e2e -k "$SYSTEM_IMAGE" -d pixel_6
          echo 'hw.keyboard=yes' >> "$ANDROID_AVD_HOME/e2e.avd/config.ini"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      # Boots while Gradle builds the APK below.
      - name: Start emulator
        run: |
          nohup "$ANDROID_HOME/emulator/emulator" -avd e2e -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect > "$RUNNER_TEMP/emulator.log" 2>&1 &
      - name: Build debug APK and tests
        run: ./gradlew :app:assembleDebug :e2e:testClasses
      # Animations off, so uiautomator finds the screen idle; screen on and unlocked for the whole run.
      - name: Wait for boot
        run: |
          timeout 300 adb wait-for-device
          timeout 300 sh -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = 1 ]; do sleep 5; done'
          for scale in window_animation_scale transition_animation_scale animator_duration_scale; do
            adb shell settings put global "$scale" 0
          done
          adb shell svc power stayon true
          adb shell input keyevent KEYCODE_WAKEUP
          adb shell wm dismiss-keyguard
      - name: E2E tests
        run: ./gradlew :e2e:e2eTest
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-reports
          path: |
            e2e/build/reports/
            e2e/build/test-results/
            ${{ runner.temp }}/emulator.log
          retention-days: 14
