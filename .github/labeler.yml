# Path-based PR labels, applied by .github/workflows/labeler.yml (actions/labeler).
# A path gets a label exactly when .github/policies/risk-tiers.policy has a rule for it;
# PolicyLabelParityTest in tests/ fails when the two files drift apart.

app:
  - changed-files:
      - any-glob-to-any-file: 'app/**'

core:
  - changed-files:
      - any-glob-to-any-file: 'core/**'

build:
  - changed-files:
      - any-glob-to-any-file:
          - 'gradle/**'
          - '*.gradle.kts'
          - 'gradle.properties'
          - 'gradlew'
          - 'gradlew.bat'
          - '.devcontainer/**'
          - 'Dockerfile*'
          - '**/Dockerfile'
          - '.dockerignore'
          - '.gitattributes'

ci:
  - changed-files:
      - any-glob-to-any-file: ['.github/**', 'scripts/**', 'tests/**', '.beads/**']

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - 'docs/**'
          - '*.md'
          - '.github/copilot-instructions.md'
          - '.cursor/**'
          - '.claude/**'
          - 'prompts/**'
