# Path-based PR labels, applied by .github/workflows/labeler.yml (actions/labeler).

app:
  - changed-files:
      - any-glob-to-any-file: 'app/**'

core:
  - changed-files:
      - any-glob-to-any-file: 'core/**'

build:
  - changed-files:
      - any-glob-to-any-file:
          - 'gradle/**'
          - '*.gradle.kts'
          - 'gradle.properties'
          - 'gradlew'
          - 'gradlew.bat'
          - '.devcontainer/**'
          - 'Dockerfile*'
          - '.dockerignore'

ci:
  - changed-files:
      - any-glob-to-any-file: ['.github/**', 'scripts/**', 'tooling/**']

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - 'docs/**'
          - '*.md'
          - '.github/copilot-instructions.md'
          - '.cursor/**'
          - '.claude/**'
