# Weekly update PRs for the workflow actions and the Gradle build.
# Dependabot only proposes changes; every PR still goes through CI and review.
# Majors stay as one PR each: AGENTS.md makes a major upgrade its own task.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        update-types: [minor, patch]

  # Reads gradle/libs.versions.toml and the build scripts of every module.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build(deps)
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # The android-all jars must be the builds the Robolectric release names for each SDK (#279); a newer one alone
      # only fails the app tests. They change with Robolectric, by hand.
      - dependency-name: org.robolectric:android-all-instrumented
