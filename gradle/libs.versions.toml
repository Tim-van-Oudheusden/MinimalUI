[versions]
agp = "9.5.0"
kotlin = "2.4.21"
activityCompose = "1.13.0"
# AndroidJUnitRunner and UiAutomator for the end-to-end tests in e2e/, run on an emulator (#236).
androidxTestRunner = "1.7.0"
androidxTestUiautomator = "2.4.0"
# bouncycastle, commonsLang3, freemarker, guava, httpclient, jdom2, jose4j: floors for build-tool transitives with
# published advisories (#147, #257), applied from the build-tool-floors bundle in build.gradle.kts. guava is also the
# floor for Robolectric's copy on the app's test classpath (#274), applied in app/build.gradle.kts.
bouncycastle = "1.86"
commonsLang3 = "3.21.0"
composeBom = "2026.09.00"
# Slack's Compose lint checks, loaded into the app's Android Lint through lintChecks.
composeLints = "1.6.1"
# The first detekt release built against Kotlin 2.4 (#135); pinned exactly, an alpha has no compatibility promise.
detekt = "2.0.0-alpha.6"
freemarker = "2.3.35"
guava = "33.7.2-jre"
httpclient = "4.5.14"
jdom2 = "2.0.6.1"
jose4j = "0.9.7"
junit = "4.13.2"
jvmTarget = "17"
kover = "0.9.11"
# The ktlint release Spotless formats Kotlin with (spotless {} in build.gradle.kts).
ktlint = "1.8.0"
robolectric = "4.17"
# The android-all jars Robolectric runs the app tests on, one per SDK they use (robolectric.properties and @Config).
# Each is the build Robolectric's DefaultSdkProvider names for that SDK: change them together with robolectric (#279).
robolectricAndroidAll28 = "9-robolectric-4913185-2-i7"
robolectricAndroidAll35 = "15-robolectric-13954326-i7"
spotless = "8.10.4"

[libraries]
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-test-uiautomator = { group = "androidx.test.uiautomator", name = "uiautomator", version.ref = "androidxTestUiautomator" }
compose-lint-checks = { group = "com.slack.lint.compose", name = "compose-lint-checks", version.ref = "composeLints" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
# Never a dependency: Spotless loads ktlint itself. Listed so Dependabot proposes ktlint updates.
ktlint-cli = { group = "com.pinterest.ktlint", name = "ktlint-cli", version.ref = "ktlint" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
# Never on a classpath: app/build.gradle.kts copies them into the directory Robolectric reads offline (#279).
robolectric-android-all-28 = { group = "org.robolectric", name = "android-all-instrumented", version.ref = "robolectricAndroidAll28" }
robolectric-android-all-35 = { group = "org.robolectric", name = "android-all-instrumented", version.ref = "robolectricAndroidAll35" }
# Never dependencies: constraints raising what AGP, Kover and Android Lint pull onto the build classpath (#147), and
# (guava) what Robolectric pulls onto the app's test classpath (#274).
bouncycastle-bcpkix = { group = "org.bouncycastle", name = "bcpkix-jdk18on", version.ref = "bouncycastle" }
bouncycastle-bcprov = { group = "org.bouncycastle", name = "bcprov-jdk18on", version.ref = "bouncycastle" }
bouncycastle-bcutil = { group = "org.bouncycastle", name = "bcutil-jdk18on", version.ref = "bouncycastle" }
commons-lang3 = { group = "org.apache.commons", name = "commons-lang3", version.ref = "commonsLang3" }
freemarker = { group = "org.freemarker", name = "freemarker", version.ref = "freemarker" }
guava = { group = "com.google.guava", name = "guava", version.ref = "guava" }
httpclient = { group = "org.apache.httpcomponents", name = "httpclient", version.ref = "httpclient" }
jdom2 = { group = "org.jdom", name = "jdom2", version.ref = "jdom2" }
jose4j = { group = "org.bitbucket.b_c", name = "jose4j", version.ref = "jose4j" }

[bundles]
# The floors build.gradle.kts puts on the build classpath and Android Lint's (#147).
build-tool-floors = [
    "bouncycastle-bcpkix",
    "bouncycastle-bcprov",
    "bouncycastle-bcutil",
    "commons-lang3",
    "freemarker",
    "guava",
    "httpclient",
    "jdom2",
    "jose4j",
]

# The android-all jars app/build.gradle.kts hands Robolectric (#279).
robolectric-android-all = [
    "robolectric-android-all-28",
    "robolectric-android-all-35",
]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# The e2e module: instrumented tests in an APK of their own, run against the app's.
android-test = { id = "com.android.test", version.ref = "agp" }
# Standalone Android Lint for the pure Kotlin/JVM modules; AGP's version.
android-lint = { id = "com.android.lint", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
