[versions]
agp = "9.4.1"
kotlin = "2.4.21"
activityCompose = "1.13.0"
composeBom = "2026.09.00"
# Slack's Compose lint checks, loaded into the app's Android Lint through lintChecks.
composeLints = "1.6.1"
junit = "4.13.2"
jvmTarget = "17"
kover = "0.9.11"
# The ktlint release Spotless formats Kotlin with (spotless {} in build.gradle.kts).
ktlint = "1.8.0"
robolectric = "4.17"
spotless = "8.10.1"

[libraries]
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
compose-lint-checks = { group = "com.slack.lint.compose", name = "compose-lint-checks", version.ref = "composeLints" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
# Never a dependency: Spotless loads ktlint itself. Listed so Dependabot proposes ktlint updates.
ktlint-cli = { group = "com.pinterest.ktlint", name = "ktlint-cli", version.ref = "ktlint" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# Standalone Android Lint for the pure Kotlin/JVM modules; AGP's version.
android-lint = { id = "com.android.lint", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
