[versions]
agp = "9.5.1"
kotlin = "2.4.21"
activityCompose = "1.13.0"
# AndroidJUnitRunner and UiAutomator for the end-to-end tests in e2e/, run on an emulator (#236).
androidxTestRunner = "1.7.0"
androidxTestUiautomator = "2.4.1"
# bouncycastle, commonsLang3, freemarker, guava, httpclient, jdom2, jose4j, orgJson: floors for build-tool transitives with
# published advisories (#147, #257), applied from the build-tool-floors bundle in build.gradle.kts. The same floors also
# reach the detekt and PIT classpaths (#444), pitestTestCompile included (#458).
bouncycastle = "1.87"
commonsLang3 = "3.22.0"
composeBom = "2026.09.00"
# Slack's Compose lint checks, loaded into the app's Android Lint through lintChecks.
composeLints = "1.6.1"
# The first detekt release built against Kotlin 2.4 (#135); pinned exactly, an alpha has no compatibility promise.
detekt = "2.0.0-alpha.6"
freemarker = "2.3.35"
guava = "33.8.0-jre"
httpclient = "4.5.14"
jdom2 = "2.0.6.1"
jose4j = "0.9.7"
junit = "4.13.2"
jvmTarget = "17"
kover = "0.9.11"
# The ktlint release Spotless formats Kotlin with (spotless {} in build.gradle.kts).
ktlint = "1.8.0"
# Floor for the lifecycle-runtime the Compose BOM brings (2.9.4): its lint.jar calls a Kotlin PSI API that AGP 9.5's
# Lint no longer has, so lint reports ObsoleteLintCustomCheck, an error here. Applied in app/build.gradle.kts.
lifecycleRuntime = "2.11.0"
# First release past GHSA-4jq9-2xhw-jpx7 and GHSA-3vqj-43w4-2q58, the org.json advisories (#444).
orgJson = "20260814"
# PIT, the mutation tester for the Kotlin modules (#412). gradle-pitest-plugin runs it on core, and its Android port on
# app's Robolectric tests; both bring an older PIT by default, so pitest pins the engine they run. pitestAndroid 0.3.0 is
# the first release that supports AGP 9.
pitest = "1.30.2"
pitestAndroid = "0.3.0"
pitestGradle = "1.19.0"
robolectric = "4.18.1"
# The android-all jars Robolectric runs the app tests on, one per SDK they use (robolectric.properties and @Config).
# Each is the build Robolectric's DefaultSdkProvider names for that SDK: change them together with robolectric (#279).
robolectricAndroidAll28 = "9-robolectric-4913185-2-i7"
robolectricAndroidAll35 = "15-robolectric-14663667-2-i7"
spotless = "8.11.0"

[libraries]
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-lifecycle-runtime = { group = "androidx.lifecycle", name = "lifecycle-runtime", version.ref = "lifecycleRuntime" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-test-uiautomator = { group = "androidx.test.uiautomator", name = "uiautomator", version.ref = "androidxTestUiautomator" }
compose-lint-checks = { group = "com.slack.lint.compose", name = "compose-lint-checks", version.ref = "composeLints" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
# Never a dependency: Spotless loads ktlint itself. Listed so Dependabot proposes ktlint updates.
ktlint-cli = { group = "com.pinterest.ktlint", name = "ktlint-cli", version.ref = "ktlint" }
# Never a dependency: the PIT engine the pitest plugin runs (pitestVersion in core/build.gradle.kts). Listed so
# Dependabot proposes PIT updates.
pitest = { group = "org.pitest", name = "pitest", version.ref = "pitest" }
# PIT's plugin API, for pitest-compose's filter (#412): compileOnly, since PIT provides it to the plugins it loads.
pitest-entry = { group = "org.pitest", name = "pitest-entry", version.ref = "pitest" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
# Never on a classpath: app/build.gradle.kts copies them into the directory Robolectric reads offline (#279).
robolectric-android-all-28 = { group = "org.robolectric", name = "android-all-instrumented", version.ref = "robolectricAndroidAll28" }
robolectric-android-all-35 = { group = "org.robolectric", name = "android-all-instrumented", version.ref = "robolectricAndroidAll35" }
# Never dependencies: constraints raising what AGP, Kover, Android Lint, detekt and PIT pull onto their classpaths (#147,
# #444).
bouncycastle-bcpkix = { group = "org.bouncycastle", name = "bcpkix-jdk18on", version.ref = "bouncycastle" }
bouncycastle-bcprov = { group = "org.bouncycastle", name = "bcprov-jdk18on", version.ref = "bouncycastle" }
bouncycastle-bcutil = { group = "org.bouncycastle", name = "bcutil-jdk18on", version.ref = "bouncycastle" }
commons-lang3 = { group = "org.apache.commons", name = "commons-lang3", version.ref = "commonsLang3" }
freemarker = { group = "org.freemarker", name = "freemarker", version.ref = "freemarker" }
guava = { group = "com.google.guava", name = "guava", version.ref = "guava" }
httpclient = { group = "org.apache.httpcomponents", name = "httpclient", version.ref = "httpclient" }
jdom2 = { group = "org.jdom", name = "jdom2", version.ref = "jdom2" }
jose4j = { group = "org.bitbucket.b_c", name = "jose4j", version.ref = "jose4j" }
org-json = { group = "org.json", name = "json", version.ref = "orgJson" }

[bundles]
# The floors build.gradle.kts puts on the build classpath and Android Lint's (#147).
build-tool-floors = [
    "bouncycastle-bcpkix",
    "bouncycastle-bcprov",
    "bouncycastle-bcutil",
    "commons-lang3",
    "freemarker",
    "guava",
    "httpclient",
    "jdom2",
    "jose4j",
    "org-json",
]

# The android-all jars app/build.gradle.kts hands Robolectric (#279).
robolectric-android-all = [
    "robolectric-android-all-28",
    "robolectric-android-all-35",
]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# The e2e module: instrumented tests in an APK of their own, run against the app's.
android-test = { id = "com.android.test", version.ref = "agp" }
# Standalone Android Lint for the pure Kotlin/JVM modules; AGP's version.
android-lint = { id = "com.android.lint", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
# Mutation testing (#412): core, and app (the Android port).
pitest = { id = "info.solidsoft.pitest", version.ref = "pitestGradle" }
pitest-android = { id = "pl.droidsonroids.pitest", version.ref = "pitestAndroid" }
