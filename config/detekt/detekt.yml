# detekt (#135) runs its default rules (buildUponDefaultConfig in build.gradle.kts); this file holds only the
# overrides, each with the reason. `check` applies them through two kinds of task (#356): the plain `detekt` task has no
# classpath and skips every rule that needs type analysis, and `detektMain` and `detektTest` run every rule.
# Main code meets every size and complexity limit but LongParameterList's, which composables are exempt from below;
# tests are exempt from those below. The Compose settings are the ones detekt documents, plus that exemption:
# https://detekt.dev/docs/introduction/compose

complexity:
  CyclomaticComplexMethod:
    # Tests only: a hand-written test helper (the tests module's YAML reader) branches as its input does.
    excludes: ['**/test/**']
  LargeClass:
    # Tests only: one test class per screen keeps its scenarios together (MainActivityTest).
    excludes: ['**/test/**']
  LongParameterList:
    # Compose: a stateless composable takes its state and callbacks as parameters; a class holding them only to pass
    # them on would hide what it depends on.
    ignoreAnnotated: ['Composable']
    # A parameter with a default costs a caller nothing, so only the ones each call must pass count.
    ignoreDefaultParameters: true

naming:
  FunctionNaming:
    # Compose: composables are named like types (AppList), which the camelCase pattern rejects.
    ignoreAnnotated: ['Composable']

style:
  FunctionOnlyReturningConstant:
    # A Robolectric shadow's @Implementation replaces an Android method, so it keeps that method's shape.
    ignoreAnnotated: ['Implementation']
  LoopWithTooManyJumpStatements:
    # Tests only: the test helpers' line-by-line parsers skip and stop with continue and break.
    excludes: ['**/test/**']
  MagicNumber:
    # Compose: colours and sizes are declared as properties (val Accent = Color(0xFF...)). detekt's default already,
    # pinned here because the UI relies on it.
    ignorePropertyDeclaration: true
  ProtectedMemberInFinalClass:
    # A Robolectric shadow's @Implementation keeps the visibility of the Android method it replaces.
    ignoreAnnotated: ['Implementation']
  ReturnCount:
    # Tests only: the test helpers' parsers return as soon as they know the answer.
    excludes: ['**/test/**']
  UnusedImport:
    # Off in detekt's defaults, and ktlint's no-unused-imports needs an .editorconfig opt-in, so without this nothing
    # in `check` fails on an import a refactor leaves behind (#369). It needs type analysis: only detektMain and
    # detektTest apply it.
    active: true
  UnusedPrivateFunction:
    # Compose: @Preview functions are called by Android Studio, never by code. (detekt 1's UnusedPrivateMember.)
    ignoreAnnotated: ['Preview']
